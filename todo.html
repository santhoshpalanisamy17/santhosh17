<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="todo.css">
    <title>ToDoList</title>
</head>
<body>
    <!-- <script src="todo.js"></script> -->


    <div class="container">
        <h1>Campus Quest</h1>
        <h2>Mission Tracker</h2>
        <p>Small steps. Big goals!</p>

        <button id="colourBtn">Change Colour</button>


        <div class="add-box">
            <input type="text" id="missionInput" placeholder="Enter a mission...">
            <button id="addBtn">Add Mission</button>
        </div>

        <div class="counts">
            <span>Total: <b id="total">0</b></span>
            <span>Completed: <b id="completed">0</b></span>
            <span>Pending: <b id="pending">0</b></span>
        </div>

        <h3>My Missions</h3>
        <ul id="missionList"></ul>
  </div>
  <script src="todo.js"></script>
</body>
</html>
